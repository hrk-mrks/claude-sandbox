<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>データと恋とダッシュボード</title>
<style>
  :root { --text: #fff; --box: #1a1530ee; --accent: #29b6f6; --gold: #ffd166; }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #000; color: var(--text); font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; display: flex; justify-content: center; }
  .inner { position: relative; width: 100%; max-width: 520px; height: 100%; }
  /* 背景 */
  #bg { position: absolute; inset: 0; transition: opacity .5s; }
  .bg-lobby { background: linear-gradient(#dfe9f3 0 62%, #9aa7b8 62% 100%); }
  .bg-lobby::before { content: ""; position: absolute; left: 30%; width: 40%; top: 14%; height: 48%; background: #6c7a8c; border: 8px solid #bfc9d6; }
  .bg-lobby::after { content: ""; position: absolute; left: 49%; width: 2%; top: 14%; height: 48%; background: #bfc9d6; }
  .bg-office { background: linear-gradient(#f3f6fa 0 58%, #cfd6e0 58% 100%); }
  .bg-office::before { content: ""; position: absolute; left: 6%; right: 6%; top: 36%; height: 22%; background: linear-gradient(#2d3b55, #1b2538); border-radius: 6px; box-shadow: 0 10px 0 #9aa7b8; }
  .bg-office::after { content: "▮▮▮ ▮▮ ▮▮▮▮  ▮▮  ▮▮▮"; position: absolute; left: 10%; top: 40%; color: #7fd1ff; font-size: 12px; letter-spacing: 2px; }
  .bg-meeting { background: linear-gradient(#eef2f7 0 60%, #b9c3d1 60% 100%); }
  .bg-meeting::before { content: ""; position: absolute; left: 12%; right: 12%; top: 12%; height: 36%; background: #fff; border: 10px solid #d7dee8; }
  .bg-meeting::after { content: "📈"; position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-size: 60px; }
  .bg-cafe { background: linear-gradient(#f9efe0 0 60%, #a0734a 60% 100%); }
  .bg-cafe::before { content: "☕"; position: absolute; left: 0; right: 0; top: 20%; text-align: center; font-size: 70px; opacity: .6; }
  .bg-server { background: linear-gradient(#0b1220, #15223a); }
  .bg-server::before { content: ""; position: absolute; left: 10%; right: 10%; top: 10%; bottom: 35%; background: repeating-linear-gradient(90deg, #1f3050 0 60px, #0b1220 60px 70px); border: 4px solid #2a3b5c; }
  .bg-server::after { content: "● ● ● ●   ● ● ● ●   ● ● ● ●"; position: absolute; left: 0; right: 0; top: 16%; text-align: center; color: #4ade80; font-size: 10px; letter-spacing: 6px; text-shadow: 0 0 8px #4ade80; }
  .bg-roof { background: linear-gradient(#ff9a5c, #ffd36b 50%, #3c3148 50%, #2b2235 100%); }
  .bg-roof::before { content: ""; position: absolute; left: 0; right: 0; top: 34%; height: 16%; background: repeating-linear-gradient(90deg, #2b2235 0 30px, #3c3148 30px 55px, #22192b 55px 90px); }
  .bg-bar { background: radial-gradient(circle at 50% 30%, #4a2f1a, #1a0f08 70%); }
  .bg-bar::before { content: "🍻"; position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-size: 64px; }
  .bg-night { background: radial-gradient(circle at 70% 25%, #fff6c0 0 30px, #1b2a5a 31px), #1b2a5a; }
  .bg-stage { background: radial-gradient(circle at 50% 60%, #3b2a6b 0%, #120c2a 60%); }
  .bg-stage::before { content: "DATA MEETUP"; position: absolute; left: 0; right: 0; top: 14%; text-align: center; color: #29b6f6; font-weight: 900; font-size: 22px; letter-spacing: 6px; text-shadow: 0 0 12px #29b6f6; }
  /* キャラ */
  #chars { position: absolute; left: 0; right: 0; bottom: 30%; height: 62%; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
  .char { height: 100%; opacity: 0; transform: translateY(20px); transition: opacity .35s, transform .35s; }
  .char.show { opacity: 1; transform: translateY(0); }
  .char.talk { animation: bob .3s; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .char svg { height: 100%; width: auto; filter: drop-shadow(0 6px 10px #0006); }
  /* テキスト */
  #box { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 28%; background: var(--box); border: 2px solid #ffffff33; border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(4px); }
  #name { position: absolute; top: -16px; left: 14px; background: var(--accent); color: #04202e; font-weight: bold; padding: 4px 14px; border-radius: 999px; font-size: 14px; display: none; }
  #name.show { display: block; }
  #text { font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  #text.narr { color: #e9e2ff; font-style: italic; }
  #arrow { position: absolute; right: 14px; bottom: 10px; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #choices { position: absolute; left: 20px; right: 20px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 12px; }
  #choices.show { display: flex; }
  #choices button { border: 2px solid var(--accent); background: #1a1530f2; color: #fff; border-radius: 14px; padding: 16px; font-size: 16px; text-align: left; animation: pop .3s backwards; }
  #choices button:active { background: var(--accent); color: #04202e; }
  #choices button.q::before { content: "💡 "; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #menu { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; display: flex; gap: 6px; }
  #menu button { background: #0008; color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  #hearts { position: absolute; top: calc(48px + env(safe-area-inset-top)); left: 10px; right: 10px; font-size: 11px; white-space: nowrap; overflow: hidden; background: #0008; border-radius: 999px; padding: 6px 10px; display: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .4s; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-10px,6px)} 40%{transform:translate(10px,-6px)} 60%{transform:translate(-6px,4px)} 80%{transform:translate(6px,-4px)} }
  /* タイトル / 画面 */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 20; }
  .screen.show { display: flex; }
  #title { background: linear-gradient(160deg, #0f2027, #203a43 50%, #2c5364); color: #e6f7ff; }
  #title h1 { font-size: 30px; margin: 0; letter-spacing: 1px; text-shadow: 0 0 16px #29b6f6aa; }
  #title .sub { font-size: 13px; margin: 6px 0 24px; opacity: .8; }
  #title input { font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid #29b6f6; width: 100%; max-width: 280px; text-align: center; margin-bottom: 14px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 28px; font-size: 17px; font-weight: bold; background: var(--accent); color: #fff; width: 100%; max-width: 280px; margin: 5px 0; box-shadow: 0 4px 0 #0e7bb3; }
  .btn.sub2 { background: #fff; color: #0e7bb3; box-shadow: 0 4px 0 #9fd6f0; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  #title a { color: #bfe6ff; font-size: 13px; margin-top: 16px; text-decoration: none; }
  .endings { font-size: 13px; color: #bfe6ff; margin-top: 12px; line-height: 1.8; }
  #ending { background: radial-gradient(circle, #2a1b4a, #0d0820); }
  #ending h2 { font-size: 14px; letter-spacing: 6px; color: var(--gold); margin: 0; }
  #ending h1 { font-size: 30px; margin: 8px 0 20px; }
  #ending p { color: #d9d0ff; font-size: 14px; line-height: 1.8; max-width: 320px; }
  #log { background: #0d0820f5; justify-content: flex-start; overflow: auto; text-align: left; }
  #log .l { font-size: 14px; line-height: 1.6; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; width: 100%; }
  #log .l b { color: var(--accent); }
</style>
</head>
<body>
<div id="stage"><div class="inner">
  <div id="bg" class="bg-lobby"></div>
  <div id="chars"><div class="char" id="charL"></div></div>
  <div class="flash" id="flash"></div>
  <div id="hearts"></div>
  <div id="menu"><button id="logBtn">ログ</button><button id="titleBtn">タイトル</button></div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="arrow">▼</div></div>
  <div id="choices"></div>

  <div class="screen show" id="title">
    <h1>📊 データと恋とダッシュボード</h1>
    <div class="sub">〜 データエンジニア恋愛シミュレーション 〜<br>dbt・Tableau・Snowflake の知識が恋の鍵</div>
    <input id="nameInput" maxlength="8" placeholder="主人公の名前（例: 結衣）">
    <button class="btn" id="newBtn">はじめから</button>
    <button class="btn sub2" id="contBtn" style="display:none">つづきから</button>
    <div class="endings" id="endList"></div>
    <a href="../../">‹ ゲーム一覧へ</a>
  </div>
  <div class="screen" id="ending">
    <h2>ENDING</h2><h1 id="endTitle"></h1><p id="endText"></p><p id="endScore" style="color:var(--gold)"></p>
    <button class="btn" id="endBack">タイトルへ</button>
  </div>
  <div class="screen" id="log"><div id="logBody" style="width:100%"></div><button class="btn sub2" id="logClose">閉じる</button></div>
</div></div>

<script>
// ===================== キャラクター =====================
const CHARS = {
  ren:  { name: "水瀬 蓮",  hair: "#b7c6e6", hairDark: "#8a9dc4", eyes: "#5b7fb0", tie: "#3b4a8a", style: "parted", color: "#7fa8ff", skill: "dbt" },
  yuma: { name: "朝日 悠真", hair: "#f0963d", hairDark: "#b8661f", eyes: "#8a5a2a", tie: "#d94b4b", style: "spiky", color: "#ffb347", skill: "Tableau" },

function sprite(id, expr = "normal") {

  const eyes = {
    normal: `<ellipse cx="80" cy="112" rx="7" ry="9" fill="${c.eyes}"/><ellipse cx="120" cy="112" rx="7" ry="9" fill="${c.eyes}"/><circle cx="83" cy="109" r="2.5" fill="#fff"/><circle cx="123" cy="109" r="2.5" fill="#fff"/>`,

  const brows = {

    sad: `<path d="M93 139 Q100 135 107 139" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,

  const blush = (expr === "blush" || expr === "smile") ? `<ellipse cx="68" cy="128" rx="9" ry="5" fill="#ff9aa2" opacity=".6"/><ellipse cx="132" cy="128" rx="9" ry="5" fill="#ff9aa2" opacity=".6"/>` : "";

    ${bangs}
    <g stroke="${c.hairDark}" stroke-width="3" fill="none" stroke-linecap="round">${brows}</g>

}

// 選択肢: { t, go, aff, q: true(知識問題), ok: true(正解) }
