<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>パンと転校生</title>
<style>
  :root { --text: #fff; --box: #1a1530ee; --accent: #ff7eb6; --gold: #ffd166; }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #000; color: var(--text); font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; display: flex; justify-content: center; }
  .inner { position: relative; width: 100%; max-width: 520px; height: 100%; }
  /* 背景 */
  #bg { position: absolute; inset: 0; transition: opacity .5s; }
  .bg-road { background: linear-gradient(#8fd3ff 0%, #d9f1ff 55%, #7fb86b 55%, #5c9b4d 100%); }
  .bg-road::after { content: ""; position: absolute; left: 0; right: 0; top: 58%; height: 18%; background: repeating-linear-gradient(90deg, #cfcfcf 0 40px, #dcdcdc 40px 80px); border-top: 6px solid #a8a8a8; }
  .bg-class { background: linear-gradient(#f6f1e6 0 60%, #c9a97a 60% 100%); }
  .bg-class::before { content: ""; position: absolute; left: 8%; right: 8%; top: 12%; height: 32%; background: #2f6b4f; border: 10px solid #8a6a3a; border-radius: 4px; }
  .bg-hall { background: linear-gradient(90deg, #e8dcc8, #f7f0e4 50%, #e8dcc8); }
  .bg-hall::before { content: ""; position: absolute; left: 0; right: 0; top: 55%; bottom: 0; background: linear-gradient(#b89a6a, #8d7146); }
  .bg-roof { background: linear-gradient(#6fc3ff 0 65%, #b8c4cc 65% 70%, #8f9aa3 70% 100%); }
  .bg-roof::before { content: ""; position: absolute; left: 0; right: 0; top: 60%; height: 10%; background: repeating-linear-gradient(90deg, #cfd6dc 0 6px, transparent 6px 22px); }
  .bg-lib { background: linear-gradient(#5a4532, #7a5f44); }
  .bg-lib::before { content: ""; position: absolute; inset: 10% 6% 35%; background: repeating-linear-gradient(90deg, #c84b4b 0 14px, #3f6fb0 14px 26px, #d9a441 26px 40px, #3b8a5a 40px 52px, #7a5f44 52px 60px); border: 8px solid #3c2a1a; }
  .bg-yard { background: linear-gradient(#9fdcff 0 50%, #79c26a 50% 100%); }
  .bg-yard::before { content: ""; position: absolute; left: 10%; top: 18%; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7bd36a, #2f8a3a); box-shadow: 120px 40px 0 -20px #3f9a48; }
  .bg-council { background: linear-gradient(#e9eef7 0 60%, #6b7a99 60% 100%); }
  .bg-council::before { content: ""; position: absolute; left: 15%; right: 15%; top: 15%; height: 30%; background: #ffffffcc; border: 6px solid #b0bdd6; }
  .bg-street { background: linear-gradient(#ff9a5c, #ffd36b 50%, #5a4a6b 50%, #3c3148 100%); }
  .bg-street::before { content: ""; position: absolute; left: 0; right: 0; top: 30%; height: 20%; background: repeating-linear-gradient(90deg, #3c3148 0 40px, #2b2235 40px 70px, #4a3d5c 70px 110px); }
  .bg-fes { background: radial-gradient(circle at 50% 70%, #ff8c42 0%, #7a2e1a 25%, #1b1030 60%); }
  .bg-fes::before { content: "✦ ✧ ✦ ✧ ✦"; position: absolute; top: 12%; left: 0; right: 0; text-align: center; color: #ffd166; font-size: 24px; letter-spacing: 24px; }
  .bg-night { background: radial-gradient(circle at 70% 25%, #fff6c0 0 30px, #1b2a5a 31px), #1b2a5a; }
  /* キャラ */
  #chars { position: absolute; left: 0; right: 0; bottom: 30%; height: 62%; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
  .char { height: 100%; opacity: 0; transform: translateY(20px); transition: opacity .35s, transform .35s; }
  .char.show { opacity: 1; transform: translateY(0); }
  .char.talk { animation: bob .3s; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .char svg { height: 100%; width: auto; filter: drop-shadow(0 6px 10px #0006); }
  /* テキスト */
  #box { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 28%; background: var(--box); border: 2px solid #ffffff33; border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(4px); }
  #name { position: absolute; top: -16px; left: 14px; background: var(--accent); color: #fff; font-weight: bold; padding: 4px 14px; border-radius: 999px; font-size: 14px; display: none; }
  #name.show { display: block; }
  #text { font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  #text.narr { color: #e9e2ff; font-style: italic; }
  #arrow { position: absolute; right: 14px; bottom: 10px; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #choices { position: absolute; left: 20px; right: 20px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 12px; }
  #choices.show { display: flex; }
  #choices button { border: 2px solid var(--accent); background: #1a1530f2; color: #fff; border-radius: 14px; padding: 16px; font-size: 16px; text-align: left; animation: pop .3s backwards; }
  #choices button:active { background: var(--accent); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #menu { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; display: flex; gap: 6px; }
  #menu button { background: #0008; color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  #hearts { position: absolute; top: calc(48px + env(safe-area-inset-top)); left: 10px; font-size: 12px; background: #0008; border-radius: 999px; padding: 6px 10px; display: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .4s; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-10px,6px)} 40%{transform:translate(10px,-6px)} 60%{transform:translate(-6px,4px)} 80%{transform:translate(6px,-4px)} }
  /* タイトル / 画面 */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 20; }
  .screen.show { display: flex; }
  #title { background: linear-gradient(160deg, #ffb6d9, #ffe3a3 50%, #b8e0ff); color: #4a2a4a; }
  #title h1 { font-size: 34px; margin: 0; letter-spacing: 2px; text-shadow: 0 2px 0 #fff; }
  #title .sub { font-size: 13px; margin: 6px 0 24px; opacity: .8; }
  #title input { font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid #ff7eb6; width: 100%; max-width: 280px; text-align: center; margin-bottom: 14px; }
  .btn { border: 0; border-radius: 14px; padding: 14px 28px; font-size: 17px; font-weight: bold; background: var(--accent); color: #fff; width: 100%; max-width: 280px; margin: 5px 0; box-shadow: 0 4px 0 #c74d86; }
  .btn.sub2 { background: #fff; color: #c74d86; box-shadow: 0 4px 0 #e0b0c8; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  #title a { color: #7a4a6a; font-size: 13px; margin-top: 16px; text-decoration: none; }
  .endings { font-size: 13px; color: #6a3a5a; margin-top: 12px; line-height: 1.8; }
  #ending { background: radial-gradient(circle, #2a1b4a, #0d0820); }
  #ending h2 { font-size: 14px; letter-spacing: 6px; color: var(--gold); margin: 0; }
  #ending h1 { font-size: 30px; margin: 8px 0 20px; }
  #ending p { color: #d9d0ff; font-size: 14px; line-height: 1.8; max-width: 320px; }
  #log { background: #0d0820f5; justify-content: flex-start; overflow: auto; text-align: left; }
  #log .l { font-size: 14px; line-height: 1.6; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; width: 100%; }
  #log .l b { color: var(--accent); }
</style>
</head>
<body>
<div id="stage"><div class="inner">
  <div id="bg" class="bg-road"></div>
  <div id="chars"><div class="char" id="charL"></div></div>
  <div class="flash" id="flash"></div>
  <div id="hearts"></div>
  <div id="menu"><button id="logBtn">ログ</button><button id="titleBtn">タイトル</button></div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="arrow">▼</div></div>
  <div id="choices"></div>

  <div class="screen show" id="title">
    <h1>🍞 パンと転校生</h1>
    <div class="sub">〜 桜咲学園 恋愛シミュレーション 〜</div>
    <input id="nameInput" maxlength="8" placeholder="主人公の名前（例: 美咲）">
    <button class="btn" id="newBtn">はじめから</button>
    <button class="btn sub2" id="contBtn" style="display:none">つづきから</button>
    <div class="endings" id="endList"></div>
    <a href="../../">‹ ゲーム一覧へ</a>
  </div>
  <div class="screen" id="ending">
    <h2>ENDING</h2><h1 id="endTitle"></h1><p id="endText"></p>
    <button class="btn" id="endBack">タイトルへ</button>
  </div>
  <div class="screen" id="log"><div id="logBody" style="width:100%"></div><button class="btn sub2" id="logClose">閉じる</button></div>
</div></div>

<script>
// ===================== キャラクター =====================
const CHARS = {
  rei:  { name: "蒼井 怜",  hair: "#b7c6e6", hairDark: "#8a9dc4", eyes: "#5b7fb0", tie: "#3b4a8a", style: "parted", color: "#7fa8ff" },
  yota: { name: "日向 陽太", hair: "#f0963d", hairDark: "#b8661f", eyes: "#8a5a2a", tie: "#d94b4b", style: "spiky", color: "#ffb347" },
  yuto: { name: "桐生 悠人", hair: "#3a3d66", hairDark: "#22243f", eyes: "#7a4ec7", tie: "#6a3fb0", style: "neat", color: "#b48cff" },
  sensei: { name: "先生", hair: "#6b6b6b", hairDark: "#4a4a4a", eyes: "#444", tie: "#555", style: "neat", color: "#aaa" },
};
function sprite(id, expr = "normal") {
  const c = CHARS[id];
  const bangs = {
    parted: `<path d="M50 104 Q46 44 100 40 Q154 44 150 104 L140 104 Q142 78 124 70 Q108 68 98 90 Q92 70 74 72 Q58 78 60 104 Z" fill="${c.hair}"/><path d="M98 90 Q104 70 124 70" stroke="${c.hairDark}" stroke-width="2" fill="none"/>`,
    spiky:  `<path d="M48 104 L50 50 Q70 30 100 34 Q130 30 150 50 L152 104 L140 96 L132 80 L120 96 L110 78 L100 98 L90 78 L80 96 L68 80 L60 96 Z" fill="${c.hair}"/>`,
    neat:   `<path d="M48 106 Q46 42 100 38 Q154 42 152 106 L140 106 Q140 80 120 80 Q104 80 100 88 Q96 80 80 80 Q60 80 60 106 Z" fill="${c.hair}"/><path d="M100 40 L100 88" stroke="${c.hairDark}" stroke-width="2"/>`,
  }[c.style];
  const eyes = {
    normal: `<ellipse cx="80" cy="112" rx="7" ry="9" fill="${c.eyes}"/><ellipse cx="120" cy="112" rx="7" ry="9" fill="${c.eyes}"/><circle cx="83" cy="109" r="2.5" fill="#fff"/><circle cx="123" cy="109" r="2.5" fill="#fff"/>`,
    smile:  `<path d="M72 114 Q80 104 88 114" stroke="${c.eyes}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M112 114 Q120 104 128 114" stroke="${c.eyes}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    surprised: `<ellipse cx="80" cy="112" rx="8" ry="11" fill="${c.eyes}"/><ellipse cx="120" cy="112" rx="8" ry="11" fill="${c.eyes}"/><circle cx="83" cy="108" r="3" fill="#fff"/><circle cx="123" cy="108" r="3" fill="#fff"/>`,
    blush:  `<ellipse cx="80" cy="113" rx="7" ry="8" fill="${c.eyes}"/><ellipse cx="120" cy="113" rx="7" ry="8" fill="${c.eyes}"/><circle cx="83" cy="110" r="2.5" fill="#fff"/><circle cx="123" cy="110" r="2.5" fill="#fff"/>`,
    angry:  `<ellipse cx="80" cy="113" rx="7" ry="8" fill="${c.eyes}"/><ellipse cx="120" cy="113" rx="7" ry="8" fill="${c.eyes}"/><circle cx="83" cy="110" r="2.5" fill="#fff"/><circle cx="123" cy="110" r="2.5" fill="#fff"/>`,
    sad:    `<ellipse cx="80" cy="113" rx="7" ry="8" fill="${c.eyes}"/><ellipse cx="120" cy="113" rx="7" ry="8" fill="${c.eyes}"/><circle cx="83" cy="110" r="2.5" fill="#fff"/><circle cx="123" cy="110" r="2.5" fill="#fff"/>`,
  }[expr] || "";
  const brows = {
    normal: `<path d="M70 98 Q80 94 90 97" /><path d="M110 97 Q120 94 130 98" />`, smile: `<path d="M70 98 Q80 93 90 96" /><path d="M110 96 Q120 93 130 98" />`,
    surprised: `<path d="M70 92 Q80 86 90 91" /><path d="M110 91 Q120 86 130 92" />`, blush: `<path d="M70 98 Q80 95 90 99" /><path d="M110 99 Q120 95 130 98" />`,
    angry: `<path d="M70 94 Q80 96 90 101" /><path d="M110 101 Q120 96 130 94" />`, sad: `<path d="M70 100 Q80 95 90 97" /><path d="M110 97 Q120 95 130 100" />`,
  }[expr] || "";
  const mouth = {
    normal: `<path d="M94 136 Q100 139 106 136" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    smile: `<path d="M90 134 Q100 144 110 134" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    surprised: `<ellipse cx="100" cy="138" rx="5" ry="7" fill="#9b3f3f"/>`,
    blush: `<path d="M94 137 Q100 141 106 137" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    angry: `<path d="M92 139 Q100 133 108 139" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    sad: `<path d="M93 139 Q100 135 107 139" stroke="#c0605a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  }[expr] || "";
  const blush = (expr === "blush" || expr === "smile") ? `<ellipse cx="68" cy="128" rx="9" ry="5" fill="#ff9aa2" opacity=".6"/><ellipse cx="132" cy="128" rx="9" ry="5" fill="#ff9aa2" opacity=".6"/>` : "";
  return `<svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 320 L46 215 Q70 190 100 190 Q130 190 154 215 L160 320 Z" fill="#2d3350"/>
    <path d="M80 196 L100 240 L120 196 L112 192 L100 212 L88 192 Z" fill="#fff"/>
    <path d="M96 198 L104 198 L106 230 L100 240 L94 230 Z" fill="${c.tie}"/>
    <path d="M46 215 L70 196 L84 220 L66 320 L40 320 Z M154 215 L130 196 L116 220 L134 320 L160 320 Z" fill="#242a44"/>
    <rect x="88" y="160" width="24" height="40" rx="8" fill="#f1cdb3"/>
    <path d="M42 120 Q38 36 100 32 Q162 36 158 120 L152 158 Q144 166 138 156 L138 112 L62 112 L62 156 Q56 166 48 158 Z" fill="${c.hairDark}"/>
    <ellipse cx="100" cy="112" rx="46" ry="54" fill="#ffe3cf"/>
    <ellipse cx="54" cy="116" rx="7" ry="10" fill="#ffe3cf"/><ellipse cx="146" cy="116" rx="7" ry="10" fill="#ffe3cf"/>
    ${bangs}
    <g stroke="${c.hairDark}" stroke-width="3" fill="none" stroke-linecap="round">${brows}</g>
    ${eyes}${blush}${mouth}
  </svg>`;
}

// ===================== シナリオ =====================
// 行: {bg} 背景 / {c, e} キャラと表情 / {n, t} 名前とセリフ（n なしは地の文）/ {fx} 演出 / {choice} 選択肢 / {go} ジャンプ / {branch} 分岐 / {end}
const SCRIPT = {
  prologue: [
    { bg: "road", c: null },
    { t: "「遅刻、遅刻ーっ！」" },
    { t: "食パンをくわえて全力疾走。\n高校二年の春、まさか自分がこんなベタな朝を迎えるなんて。" },
    { t: "曲がり角を曲がった、その瞬間——" },
    { fx: "shake", t: "ドンッ！！" },
    { fx: "flash", t: "「いたた……」" },
    { c: "rei", e: "surprised", n: "？？？", t: "……大丈夫？" },
    { t: "見上げると、見たことのない顔の男子が立っていた。\n銀色がかった髪、切れ長の瞳。整いすぎた顔が、逆光の中で少し困ったように私を見ている。" },
    { c: "rei", e: "normal", n: "？？？", t: "パン、落ちたけど。" },
    { choice: [
      { t: "「ご、ごめんなさい！」", go: "p_a", aff: { rei: 1 } },
      { t: "「そっちこそ前見てよ！」", go: "p_b", aff: { rei: 2 } },
      { t: "「……半分、食べる？」", go: "p_c", aff: { rei: 3 } },
    ] },
  ],
  p_a: [
    { c: "rei", e: "normal", n: "？？？", t: "別に。俺も前見てなかった。" },
    { c: "rei", e: "smile", n: "？？？", t: "……でも、朝からパンくわえて走る人、初めて見た。" },
    { go: "p_end" },
  ],
  p_b: [
    { c: "rei", e: "surprised", n: "？？？", t: "……。" },
    { c: "rei", e: "smile", n: "？？？", t: "ふ。ぶつかっておいて逆ギレか。面白い人だね。" },
    { go: "p_end" },
  ],
  p_c: [
    { c: "rei", e: "surprised", n: "？？？", t: "落ちたパンを？" },
    { c: "rei", e: "smile", n: "？？？", t: "……君、変わってるな。嫌いじゃないけど。" },
    { go: "p_end" },
  ],
  p_end: [
    { c: "rei", e: "normal", n: "？？？", t: "俺は蒼井怜。今日からこの学校に転校してきた。" },
    { c: "rei", e: "normal", n: "蒼井 怜", t: "——また後で。" },
    { c: null, t: "そう言って、彼は校門の方へ歩いていった。\n……って、私も遅刻！！" },
    { go: "classroom" },
  ],
  classroom: [
    { bg: "class", c: "sensei", e: "normal", n: "先生", t: "席につけー。今日は転校生を紹介する。" },
    { c: "rei", e: "normal", n: "蒼井 怜", t: "蒼井怜です。よろしく。" },
    { c: null, t: "教室がざわつく。女子の視線が一斉に彼に集まった。\n……さっきの人だ。" },
    { c: "sensei", e: "normal", n: "先生", t: "席は……{name}の隣が空いてるな。そこに座れ。" },
    { c: "rei", e: "smile", n: "蒼井 怜", t: "さっきぶり。パンの人。" },
    { c: null, t: "パンの人って呼ばないで……！" },
    { c: "yota", e: "smile", n: "日向 陽太", t: "おい{name}、また遅刻ギリギリかよ。パンくわえて走ってたって本当か？ 漫画かよ。" },
    { c: null, t: "幼なじみの日向陽太。小学校からずっと一緒の、いわゆる腐れ縁。\nサッカー部のエースで、無駄に明るい。" },
    { c: "yota", e: "normal", n: "日向 陽太", t: "ま、転校生と仲良くなるのはいいけどさ。……俺のこと忘れんなよ。" },
    { c: null, t: "休み時間。さて、どうしよう。" },
    { choice: [
      { t: "怜に学校を案内する", go: "rei_tour", aff: { rei: 2 } },
      { t: "陽太とだらだら話す", go: "yota_talk", aff: { yota: 2 } },
      { t: "遅刻の反省文を生徒会室に出しに行く", go: "yuto_room", aff: { yuto: 2 } },
    ] },
  ],
  rei_tour: [
    { bg: "hall", c: "rei", e: "normal", n: "蒼井 怜", t: "案内、頼める？ この学校、無駄に広い。" },
    { c: null, t: "特別教室棟、体育館、購買。そして最後に、図書室。" },
    { bg: "lib", c: "rei", e: "normal", n: "蒼井 怜", t: "……ここ、静かでいいな。" },
    { c: "rei", e: "normal", n: "蒼井 怜", t: "君は、よく来るの？" },
    { choice: [
      { t: "「毎日来るよ。本が好きだから」", go: "rei_tour2", aff: { rei: 1 } },
      { t: "「漫画コーナーだけね」", go: "rei_tour3", aff: { rei: 1 } },
    ] },
  ],
  rei_tour2: [
    { c: "rei", e: "smile", n: "蒼井 怜", t: "そっか。じゃあ、ここに来れば君に会えるんだ。" },
    { go: "rei_tour_end" },
  ],
  rei_tour3: [
    { c: "rei", e: "smile", n: "蒼井 怜", t: "正直だな。……俺も、実はそっち派。" },
    { go: "rei_tour_end" },
  ],
  rei_tour_end: [
    { c: "rei", e: "sad", n: "蒼井 怜", t: "前の学校でも、図書室が好きだった。\n……一人でいても、変に思われないから。" },
    { c: null, t: "少しだけ寂しそうな横顔。\n聞いてはいけない気がして、私は何も言えなかった。" },
    { go: "lunch" },
  ],
  yota_talk: [

  $("text").className = line.n ? "" : "narr";
  typeText(fmt(line.t));
  logLines.push({ n: line.n, t: fmt(line.t) }); if (logLines.length > 60) logLines.shift();
}
function typeText(t) {
  clearInterval(typing); const el = $("text"); el.textContent = ""; $("arrow").style.visibility = "hidden"; let i = 0;
  typing = setInterval(() => { el.textContent = t.slice(0, ++i); if (i >= t.length) { clearInterval(typing); typing = null; $("arrow").style.visibility = "visible"; } }, 28);
  typing.full = t;
}
function advance() {
  if (!G || $("choices").classList.contains("show") || $("ending").classList.contains("show") || $("log").classList.contains("show")) return;
  if (typing) { clearInterval(typing); const l = SCRIPT[G.scene][G.i]; $("text").textContent = fmt(l.t); typing = null; $("arrow").style.visibility = "visible"; return; }
  G.i++; run();
}
function showChoices(list) {
  const box = $("choices"); box.innerHTML = ""; box.classList.add("show");
  list.forEach((ch, k) => {
    const b = document.createElement("button"); b.textContent = ch.t; b.style.animationDelay = k * 0.08 + "s";
    b.addEventListener("click", e => { e.stopPropagation(); for (const [c, v] of Object.entries(ch.aff || {})) G.aff[c] += v; box.classList.remove("show"); logLines.push({ n: "▶ 選択", t: ch.t }); G.scene = ch.go; G.i = 0; run(); });
    box.appendChild(b);
  });
}
function showEnding(line) {
  if (!unlocked.includes(line.end)) { unlocked.push(line.end); try { localStorage.setItem("otome-endings", JSON.stringify(unlocked)); } catch {} }
  try { localStorage.removeItem("otome-save"); } catch {}
  $("endTitle").textContent = line.title; $("endText").textContent = line.text; $("ending").classList.add("show");
}
function toTitle() { $("ending").classList.remove("show"); $("hearts").style.display = "none"; showChar(null); $("title").classList.add("show"); renderTitle(); }
function renderTitle() {
  let has = false; try { has = !!localStorage.getItem("otome-save"); } catch {}
  $("contBtn").style.display = has ? "block" : "none";
  const names = { rei_happy: "曲がり角で待ってる", rei_normal: "答えは、まだ", yota_happy: "十年越しの初恋", yota_normal: "幼なじみのままで", yuto_happy: "会長命令", yuto_normal: "保留という名の特別", friend: "みんなで見た花火" };
  $("endList").innerHTML = `エンディング ${unlocked.length} / ${ENDINGS.length}<br>` + ENDINGS.map(e => unlocked.includes(e) ? "★ " + names[e] : "☆ ？？？").join("<br>");
}

// ===== イベント =====
$("stage").addEventListener("click", e => { if (e.target.closest("button, a, input, .screen, #choices")) return; advance(); });
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); advance(); } });
$("newBtn").addEventListener("click", () => { const n = $("nameInput").value.trim() || "美咲"; try { localStorage.setItem("otome-name", n); } catch {} startNew(n); });
$("contBtn").addEventListener("click", load);
$("endBack").addEventListener("click", toTitle);
$("titleBtn").addEventListener("click", () => { if (confirm("タイトルに戻りますか？（進行状況は自動保存されています）")) toTitle(); });
$("logBtn").addEventListener("click", () => { $("logBody").innerHTML = logLines.map(l => `<div class="l">${l.n ? `<b>${l.n}</b><br>` : ""}${l.t.replace(/\n/g, "<br>")}</div>`).join("") || "<div class='l'>まだログはありません</div>"; $("log").classList.add("show"); });
$("logClose").addEventListener("click", () => $("log").classList.remove("show"));
try { $("nameInput").value = localStorage.getItem("otome-name") || ""; } catch {}
renderTitle();
</script>
<script>
(function () {
  document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
})();
</script>
</body>
