<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミニゲーム集</title>
<style>
  :root { --bg: #1b1b1f; --panel: #2a2a30; --text: #f4f4f4; --sub: #9a9aa3; --accent: #ff6b4a; }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 480px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--sub); font-size: 14px; margin: 0 0 20px; }
  .list { display: grid; gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border-radius: 14px; padding: 16px;
    color: inherit; text-decoration: none;
  }
  a.card:active { opacity: .8; }
  .icon { font-size: 36px; line-height: 1; }
  .title { font-size: 18px; font-weight: bold; }
  .desc { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .arrow { margin-left: auto; color: var(--sub); }
</style>
</head>
<body>
<div class="app">
  <h1>🎮 ミニゲーム集</h1>
  <p class="lead">スマホで遊べる、1ファイル完結のゲームたち</p>
  <div class="list">
    <a class="card" href="games/sushida/">
      <div class="icon">🍣</div>
      <div>
        <div class="title">スマホ寿司打</div>
        <div class="desc">60秒ローマ字タイピング</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="games/gacha/">
      <div class="icon">💎</div>
      <div>
        <div class="title">無限ガチャ</div>
        <div class="desc">石1000個でレアモンスターを狙え。派手演出つき</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="games/platformer/">
      <div class="icon">🍄</div>
      <div>
        <div class="title">ジャンプアドベンチャー</div>
        <div class="desc">横スクロールアクション。難易度★1〜★3の3ステージ</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="games/tetris/">
      <div class="icon">🧱</div>
      <div>
        <div class="title">テトリス</div>
        <div class="desc">タップで回転、長押しで高速落下</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="games/charisou/">
      <div class="icon">🚲</div>
      <div>
        <div class="title">チャリ走</div>
        <div class="desc">自動で進むエンドレスラン。タップでジャンプ、2段ジャンプ対応</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="games/numbers/">
      <div class="icon">🔢</div>
      <div>
        <div class="title">数字タッチ 1→20</div>
        <div class="desc">バラバラの数字を順番にタップ。タイムを競う</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>
</div>

<script>
// iOS Safari のダブルタップ/ピンチズーム防止（user-scalable=no は iOS では無効）
(function () {
  document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
  let last = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    // ボタン類は click を殺さないよう除外（CSS の touch-action: manipulation で対応）
    const interactive = e.target.closest("button, a, input, .btn, [data-tap]");
    if (!interactive && now - last < 350) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
</body>
</html>
